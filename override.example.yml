# Adds MongoDB and Mongo Express alongside the bot and the OAuth server.
#
# 1. Copy this file to "docker-compose.override.yml"
# 2. Set MONGO_INITDB_ROOT_USERNAME, MONGO_INITDB_ROOT_PASSWORD and
#    MONGO_EXPRESS_USERNAME / MONGO_EXPRESS_PASSWORD in your .env
# 3. Set MONGO_HOST in your .env to
#    mongodb://<MONGO_INITDB_ROOT_USERNAME>:<MONGO_INITDB_ROOT_PASSWORD>@mongodb:27017/?authSource=admin
# 4. Run "docker compose up -d" as usual
services:
  mongodb:
    container_name: mongo
    # MongoDB 5.0 and newer require a CPU with AVX support. If yours does not
    # have it you will need an older image, but note that the 4.x series is
    # past end of life and no longer receives security fixes.
    image: mongo:7
    volumes:
      - ./server/mongo-data:/data/db
    # Setting the root username and password makes the official image create
    # that user and turn on authentication by itself; no --noauth default
    # that left the database open to anything able to reach the network.
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_INITDB_ROOT_USERNAME:?set MONGO_INITDB_ROOT_USERNAME in .env}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_INITDB_ROOT_PASSWORD:?set MONGO_INITDB_ROOT_PASSWORD in .env}"
    # Not published on the host: only the bot and the server need to reach it,
    # and they do so over the internal network.
    restart: always
    healthcheck:
      test: ["CMD", "mongosh", "--quiet",
             "-u", "${MONGO_INITDB_ROOT_USERNAME:?set MONGO_INITDB_ROOT_USERNAME in .env}",
             "-p", "${MONGO_INITDB_ROOT_PASSWORD:?set MONGO_INITDB_ROOT_PASSWORD in .env}",
             "--authenticationDatabase", "admin",
             "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - Starguard

  mongo-express:
    container_name: mongo-express
    image: mongo-express
    ports:
      # Bound to the loopback interface so the database admin UI is not exposed
      # to the internet. Reach it through an SSH tunnel, or change this to
      # ${MONGO_EXPRESS_PORT}:8081 only if it sits behind your own auth.
      - 127.0.0.1:${MONGO_EXPRESS_PORT:-8081}:8081
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"
      # The database now requires authentication; Mongo Express connects as
      # the same root user.
      ME_CONFIG_MONGODB_ADMINUSERNAME: "${MONGO_INITDB_ROOT_USERNAME:?set MONGO_INITDB_ROOT_USERNAME in .env}"
      ME_CONFIG_MONGODB_ADMINPASSWORD: "${MONGO_INITDB_ROOT_PASSWORD:?set MONGO_INITDB_ROOT_PASSWORD in .env}"
      # Required: compose refuses to start if these are unset, rather than
      # silently falling back to admin/password.
      ME_CONFIG_BASICAUTH_USERNAME: "${MONGO_EXPRESS_USERNAME:?set MONGO_EXPRESS_USERNAME in .env}"
      ME_CONFIG_BASICAUTH_PASSWORD: "${MONGO_EXPRESS_PASSWORD:?set MONGO_EXPRESS_PASSWORD in .env}"
    depends_on:
      - mongodb
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - Starguard
