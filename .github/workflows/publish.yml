name: Publish images

# The one place that builds and pushes a container image. Both callers are in
# release.yml: every push to main publishes :main and the commit sha, and the
# merge of a release-please pull request additionally publishes the version
# tags and moves :latest. Keeping this in a single reusable workflow is what
# stops the tag plan, the platform list and the signing step from drifting
# apart between the two paths, which is what happened while ci.yml and
# release.yml each carried their own copy.
#
# It runs in two stages, and the split is the whole point rather than an
# organisational preference. The first stage pushes each image by digest and
# signs it; nothing it pushes carries a tag, so nothing it pushes is
# reachable by anybody pulling. The second stage does nothing but move tags
# onto digests the first stage has already signed, and it does not start
# until every leg of the first has finished. A build that fails, a Fulcio
# exchange that fails, a cosign run that fails, and a sibling image that
# fails all now leave :main, :latest and the version tags exactly where they
# were, pointing at the last release that completed.
on:
  workflow_call:
    inputs:
      version:
        description: >-
          The release version being published, without the leading "v", for
          example "1.2.0". Leave empty for an ordinary push to main, which
          publishes only the floating :main tag and the immutable commit sha.
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Build and sign (${{ matrix.image }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Push to the GitHub Packages registry.
      packages: write
      # Mint the short-lived OIDC token cosign exchanges for a Fulcio
      # certificate. Without it the signing step below fails at the point of
      # requesting the certificate, not at the point of pushing.
      id-token: write
    strategy:
      # Both legs run to completion even when one has already failed, so the
      # log says whether the other image was buildable rather than leaving a
      # cancelled job to be re-run to find out. Letting them both finish is
      # safe here in a way it was not when this job moved tags: an untagged
      # digest is not reachable by tag, so a leg that succeeds beside one
      # that fails publishes nothing anybody can pull.
      fail-fast: false
      matrix:
        include:
          - image: starguard-bot
            dockerfile: Dockerfile.bot
          - image: starguard-server
            dockerfile: Dockerfile.server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve the image reference
        id: ref
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ matrix.image }}
        run: |
          # A container reference has no uppercase in its path, but
          # github.repository_owner preserves the account name exactly as
          # GitHub spells it. Under an owner with a capital in it the old
          # ghcr.io/${{ github.repository_owner }}/... expression produced
          # ghcr.io/LibreChat-AI/starguard-bot, which the registry rejects
          # with "invalid reference format" after the whole build has run.
          # Lowercasing here is what makes this workflow work in a fork.
          echo "image=ghcr.io/${OWNER,,}/${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Compute the OCI labels and annotations
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.ref.outputs.image }}
          # The tag plan belongs to the promote job, which is the only place
          # a tag is written. Whatever this step computes here is unused.
          flavor: latest=false
          tags: type=sha,format=long

      # Emulation for the linux/arm64 leg of the build below. Every pinned
      # dependency is either pure Python or ships a manylinux aarch64 wheel,
      # and requirements.lock carries the hashes for those wheels too, so the
      # arm64 image installs from the same hash-pinned closure as amd64
      # rather than compiling anything under emulation.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to the GitHub Packages registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }} by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # arm64 as well as amd64, so the images run on an Apple Silicon
          # machine or a small ARM server without emulation at run time.
          platforms: linux/amd64,linux/arm64
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          # push-by-digest pushes the manifest and every layer but writes no
          # tag, which is what lets this run before anything is known to be
          # good. An untagged manifest is reachable only by its digest, so a
          # run that gets this far and then fails to sign leaves nothing an
          # operator or a compose file can resolve.
          outputs: type=image,name=${{ steps.ref.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          # An SBOM lists what is actually inside the image, so a future
          # advisory can be answered by querying the published artifact
          # rather than by guessing from requirements.lock at that commit.
          sbom: true
          # mode=max records the build's own inputs (the Dockerfile, the
          # source of every layer, the workflow that ran it) rather than just
          # the fact that a build happened, which is what makes the
          # attestation worth verifying.
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the pushed digest
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        # Keyless signing: cosign exchanges this job's OIDC token for a
        # short-lived Fulcio certificate and records the signature in the
        # public Rekor transparency log, so there is no private key in this
        # repository's secrets to leak or rotate.
        #
        # The signature covers the digest. Every tag the promote job goes on
        # to write points at this same digest, so signing once here covers
        # all of them, and a tag can never reach a digest this step did not
        # sign because no tag is written until this step has passed.
        # Verify a pulled image with:
        #
        #   cosign verify ghcr.io/<owner>/starguard-bot:latest \
        #     --certificate-identity-regexp \
        #       "^https://github.com/<owner>/Starguard/.github/workflows/" \
        #     --certificate-oidc-issuer \
        #       https://token.actions.githubusercontent.com
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Hand the signed digest to the promote job
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_NAME: ${{ matrix.image }}
        # A file rather than a job output: outputs from the legs of a matrix
        # job are written into one shared map, so two legs setting the same
        # key race and the loser is silently dropped. One artifact per image
        # has no shared name to collide on.
        run: |
          mkdir -p /tmp/digest
          printf '%s' "$DIGEST" > "/tmp/digest/${IMAGE_NAME}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.image }}
          path: /tmp/digest/${{ matrix.image }}
          retention-days: 1
          # The promote job reads this to decide what a tag points at, so an
          # empty upload has to fail here rather than there.
          if-no-files-found: error

  promote:
    name: Promote the tags (${{ matrix.image }})
    # Every leg of the build job has to have pushed and signed before any
    # user-facing tag moves anywhere. A failure in either image's build or
    # signature skips this job for both, which is what stops a compose file
    # pulling a bot and a server from two different commits.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # By the time this job runs, both digests are pushed and signed, so
      # the only thing left that can fail is a registry tag write. The two
      # legs can still fail independently, and a tag write that fails after
      # its sibling succeeded is the one window this design does not close;
      # re-running the job promotes the same digests again, because the
      # artifacts and the signatures are unchanged.
      fail-fast: false
      matrix:
        include:
          - image: starguard-bot
          - image: starguard-server
    steps:
      - name: Resolve the image reference and the tag plan
        id: ref
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ matrix.image }}
          VERSION: ${{ inputs.version }}
        run: |
          echo "image=ghcr.io/${OWNER,,}/${IMAGE}" >> "$GITHUB_OUTPUT"

          # :latest follows the newest stable release rather than the tip of
          # main, because that is the tag the compose files pull: an operator
          # running "docker compose pull" should land on a release someone
          # decided to cut, not on whatever merged an hour ago. The tip of
          # main is still published, as :main, for anyone who wants it.
          #
          # A prerelease (1.2.0-rc.1) is a release but not a stable one, so it
          # gets its own version tag and leaves :latest where it was. The test
          # is "the version contains a hyphen", which is exactly SemVer's own
          # prerelease marker; ${VERSION#*-} removing nothing means there was
          # no hyphen to remove.
          if [ -n "$VERSION" ] && [ "${VERSION#*-}" = "$VERSION" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute the tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.ref.outputs.image }}
          # latest=auto would key :latest off the git ref, which is a branch
          # here rather than a tag on every path including a release. The
          # decision is made in the step above instead.
          flavor: latest=false
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern=v{{version}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=semver,pattern=v{{major}}.{{minor}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=raw,value=latest,enable=${{ steps.ref.outputs.latest == 'true' }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: digest-${{ matrix.image }}
          path: /tmp/digest

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to the GitHub Packages registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Point the tags at the signed digest
        id: promote
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
          IMAGE_NAME: ${{ matrix.image }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail

          digest="$(cat "/tmp/digest/${IMAGE_NAME}")"
          if [ -z "$digest" ]; then
            echo "::error::The build job recorded no digest for ${IMAGE_NAME}." >&2
            exit 1
          fi

          mapfile -t planned < <(printf '%s\n' "$TAGS" | sed '/^[[:space:]]*$/d')
          if [ "${#planned[@]}" -eq 0 ]; then
            echo "::error::The tag plan for ${IMAGE_NAME} is empty; refusing to promote nothing." >&2
            exit 1
          fi

          args=()
          for tag in "${planned[@]}"; do
            args+=(--tag "$tag")
          done

          echo "Pointing ${#planned[@]} tag(s) at ${IMAGE}@${digest}"
          docker buildx imagetools create "${args[@]}" "${IMAGE}@${digest}"

          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Check every tag resolves to the digest that was signed
        env:
          DIGEST: ${{ steps.promote.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        # The signature covers a digest, not a name, so the guarantee this
        # workflow offers holds only while the tags resolve to the digest the
        # build job signed. "imagetools create" is expected to copy the index
        # rather than rebuild it, which preserves the digest, but that is an
        # assumption about another tool's internals and it is cheap to stop
        # assuming: read each tag back and say which ones were checked, so a
        # silent pass and a check that examined nothing cannot look alike.
        run: |
          set -euo pipefail

          mapfile -t planned < <(printf '%s\n' "$TAGS" | sed '/^[[:space:]]*$/d')
          checked=0
          for tag in "${planned[@]}"; do
            actual="$(docker buildx imagetools inspect "$tag" --format '{{.Manifest.Digest}}')"
            if [ "$actual" != "$DIGEST" ]; then
              echo "::error::${tag} resolves to ${actual}, but the signature covers ${DIGEST}. The tag is published and unsigned; sign ${actual} or re-run this job." >&2
              exit 1
            fi
            checked=$((checked + 1))
          done
          echo "Checked ${checked} tag(s) against the signed digest ${DIGEST}."

      - name: Summarise what was published
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.promote.outputs.digest }}
        # A run that pushed nothing and a run that pushed everything both end
        # green, so say which tags moved and onto which digest. Without this
        # the only way to find out is to go and look at the registry.
        run: |
          {
            echo "### ${IMAGE}"
            echo
            echo "Digest: \`${DIGEST}\`"
            echo
            echo "Signed with cosign, built for linux/amd64 and linux/arm64."
            echo
            echo "Tags published:"
            echo
            printf '%s\n' "$TAGS" | while IFS= read -r tag; do
              [ -n "$tag" ] && echo "- \`${tag}\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"
