name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality (lint, format, types)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
      - name: ruff check
        run: ruff check .
      - name: ruff format
        run: ruff format --check .
      - name: mypy
        run: mypy .
      - name: pylint
        run: pylint $(git ls-files '*.py')

  security:
    name: Security (bandit, pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
      - name: bandit
        run: bandit -r bot common server
      - name: pip-audit
        # Audits the full 37-package transitive closure in requirements.lock
        # rather than just the 8 direct pins in requirements.txt, since that
        # is where most advisories land. --require-hashes reads the pinned
        # hashes directly instead of resolving into a throwaway virtualenv,
        # which also sidesteps environments where venv creation is broken.
        run: pip-audit -r requirements.lock --require-hashes --disable-pip
      - name: pip-audit (dev dependencies)
        # Same shape as the production check above: requirements-dev.lock is
        # the hash-pinned, fully resolved closure of requirements-dev.txt
        # (84 packages against 10 direct pins, including the transitive
        # dependencies of the dev tools themselves, e.g. astroid under
        # pylint), generated and installed the same way.
        run: pip-audit -r requirements-dev.lock --require-hashes --disable-pip

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
      - name: Run the test suite with coverage
        run: pytest -q --cov --cov-report=term-missing --cov-report=xml

  lockfile:
    name: Lockfile drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Regenerate requirements.lock
        run: uv pip compile requirements.txt --generate-hashes --python-version 3.11 -o requirements.lock
      - name: Regenerate requirements-dev.lock
        run: uv pip compile requirements-dev.txt --generate-hashes --python-version 3.11 -o requirements-dev.lock
      - name: Fail if either lock is out of date
        # uv embeds the -o path verbatim into the file's own header comment,
        # so both regenerations above write back to their original filenames
        # rather than a temp path; writing anywhere else produces a spurious
        # one-line diff on that header alone even when the content matches.
        # Both locks are checked here, rather than stopping at the first,
        # so a push that moves both requirements.txt and requirements-dev.txt
        # reports both mismatches in one run instead of one fix at a time.
        run: |
          drift_found=0
          if ! git diff --exit-code -- requirements.lock; then
            echo "::error::requirements.lock does not match requirements.txt. Regenerate it with: uv pip compile requirements.txt --generate-hashes --python-version 3.11 -o requirements.lock, then commit both files."
            drift_found=1
          fi
          if ! git diff --exit-code -- requirements-dev.lock; then
            echo "::error::requirements-dev.lock does not match requirements-dev.txt. Regenerate it with: uv pip compile requirements-dev.txt --generate-hashes --python-version 3.11 -o requirements-dev.lock, then commit both files."
            drift_found=1
          fi
          exit $drift_found

  docker:
    name: Docker build (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: starguard-bot
            dockerfile: Dockerfile.bot
          - image: starguard-server
            dockerfile: Dockerfile.server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: hadolint (${{ matrix.dockerfile }})
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
          config: .hadolint.yaml
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build ${{ matrix.image }} (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: ${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  publish:
    name: Publish (${{ matrix.image }})
    needs: [quality, security, test, docker, lockfile]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: starguard-bot
            dockerfile: Dockerfile.bot
          - image: starguard-server
            dockerfile: Dockerfile.server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to the GitHub Packages registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
