name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - name: Reject tags that are not a valid container reference
        env:
          REF_NAME: ${{ github.ref_name }}
        # The container tag grammar ([\w][\w.-]{0,127}) has no room for the
        # "+" in SemVer build metadata (e.g. v1.2.3+build), so a tag like
        # that would pass the v* trigger and then fail deep inside the
        # docker/build-push-action step below with a confusing error, after
        # the full CI gate has already run. Reject it here instead, before
        # the ci job spends any time on it. Build metadata carries no
        # release-identity meaning under SemVer, so rejecting rather than
        # mangling it into the tag keeps the container tag, the git tag and
        # the CHANGELOG.md heading this workflow reads all in agreement.
        # The regex components are each unbounded, so a long enough
        # prerelease identifier (e.g. v1.2.3- followed by 122 characters)
        # would still match it while exceeding the grammar's own 128
        # character cap; the length check catches what the regex cannot
        # bound on its own, for the same fail-fast reason.
        run: |
          if ! [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]] || [ "${#REF_NAME}" -gt 128 ]; then
            echo "::error::Tag '$REF_NAME' is not a supported release tag. Expected vMAJOR.MINOR.PATCH with an optional -prerelease suffix, at most 128 characters total; SemVer build metadata (e.g. +build) is not valid in a container tag and is rejected." >&2
            exit 1
          fi

  ci:
    name: CI gate
    needs: validate-tag
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  publish-images:
    name: Publish (${{ matrix.image }})
    needs: [validate-tag, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: starguard-bot
            dockerfile: Dockerfile.bot
          - image: starguard-server
            dockerfile: Dockerfile.server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to the GitHub Packages registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  github-release:
    name: Create GitHub release
    needs: publish-images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Extract release notes from CHANGELOG.md
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="${REF_NAME#v}"
          awk -v ver="$version" '
            BEGIN { found = 0 }
            /^## \[/ {
              if (found) exit
              if ($0 ~ ("\\[" ver "\\]")) { found = 1; next }
              next
            }
            found { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "No CHANGELOG.md section found for version $version" >&2
            exit 1
          fi
      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: release_notes.md
          # validate-tag only accepts a prerelease suffix introduced by a
          # hyphen (vMAJOR.MINOR.PATCH-suffix); this input defaults to false,
          # which would otherwise publish an rc/beta tag as a normal release
          # and let it be picked up as latest.
          prerelease: ${{ contains(github.ref_name, '-') }}
