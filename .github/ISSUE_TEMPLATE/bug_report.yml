name: Bug report
description: Report something that is not working as expected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. If this is a security
        vulnerability, please use SECURITY.md instead of a public issue.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Discord bot
        - OAuth server
        - Docker / compose
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Output of `docker compose logs`, with secrets redacted.
      render: shell
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Starguard version or commit
    validations:
      required: true
